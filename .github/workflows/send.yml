name: tgtagbot

# Расписание задаётся здесь в UTC: 09:00 UTC = 12:00 MSK. 3 = среда, 0 = воскресенье.
# send.py дополнительно перепроверяет день недели по TIMEZONE, так что ошибка в cron
# не приведёт к сообщению в неправильный день — просто ничего не отправится.
on:
  schedule:
    - cron: "0 9 * * 3,0"
  workflow_dispatch:
    inputs:
      force:
        description: "Отправить, даже если сегодня не день по расписанию"
        type: boolean
        default: false
      dry_run:
        description: "Только показать текст в логе, ничего не отправлять"
        type: boolean
        default: false

# нужно, чтобы коммитить обратно state/state.json
permissions:
  contents: write

concurrency:
  group: tgtagbot-send
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Отправка
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          SEND_DAYS: wed,sun
          SEND_TIME: "12:00"
          TIMEZONE: Europe/Moscow
          STATE_FILE: state/state.json
        run: |
          args=""
          [[ "${{ inputs.force }}" == "true" ]] && args="$args --force"
          [[ "${{ inputs.dry_run }}" == "true" ]] && args="$args --dry-run"
          python send.py $args

      - name: Сохранить состояние в репозиторий
        # even if the send failed: там записана деактивация чатов, которые нас отшили
        if: always()
        run: |
          if [[ -z "$(git status --porcelain state)" ]]; then
            echo "состояние не изменилось, коммитить нечего"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state
          git commit -m "tgtagbot: состояние после отправки"
          git pull --rebase --autostash
          git push
